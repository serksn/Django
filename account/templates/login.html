{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6 text-center">Вход</h2>

<form method="post" class="space-y-4 max-w-sm mx-auto">
    {% csrf_token %}

    <div class="space-y-1">
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" required
               class="w-full px-3 py-2 border border-gray-300 rounded
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
    </div>

    <div class="space-y-1">
        <label class="block text-sm font-medium text-gray-700">Пароль</label>
        <input type="password" name="password" required
               class="w-full px-3 py-2 border border-gray-300 rounded
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
    </div>

    <button class="inline-flex items-center justify-center px-4 py-2 rounded
                   bg-blue-500 text-white text-sm font-medium hover:bg-blue-600 transition">
        Войти
    </button>
</form>
{% endblock %}
