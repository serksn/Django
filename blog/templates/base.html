<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сайт{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2c3e50',
              primaryDark: '#1f2a36',
              accent: '#3498db',
              accentDark: '#2980b9',
            }
          }
        }
      }
    </script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800 font-sans">
<header class="bg-primary text-white">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-4 py-4">
        <nav class="space-x-4">
            <a href="{% url 'home' %}" class="px-3 py-1 rounded hover:bg-primaryDark transition">Главная</a>
            <a href="{% url 'authors_stats' %}" class="px-3 py-1 rounded hover:bg-primaryDark transition">Авторы</a>

            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="px-3 py-1 rounded hover:bg-primaryDark transition">Профиль</a>
                <a href="{% url 'logout' %}" class="px-3 py-1 rounded hover:bg-primaryDark transition">Выход</a>
            {% else %}
                <a href="{% url 'login' %}" class="px-3 py-1 rounded hover:bg-primaryDark transition">Вход</a>
                <a href="{% url 'register' %}" class="px-3 py-1 rounded hover:bg-primaryDark transition">Регистрация</a>
            {% endif %}
        </nav>
    </div>
    <div class="max-w-5xl mx-auto px-4 py-2">
        <form class="flex" method="get" action="{% url 'search' %}">
            <input type="text" name="q" placeholder="Поиск статей..." value="{{ query|default:'' }}"
                   class="flex-1 px-3 py-2 rounded-l border border-gray-300 focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent">
            <button type="submit"
                    class="px-4 py-2 bg-accent hover:bg-accentDark text-white rounded-r transition">
                Искать
            </button>
        </form>
    </div>
</header>
<main class="max-w-5xl mx-auto mt-6 px-4">
    {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
                <div class="px-3 py-2 rounded text-sm
                    {% if message.tags == 'success' %} bg-green-100 text-green-800
                    {% elif message.tags == 'error' %} bg-red-100 text-red-800
                    {% elif message.tags == 'info' %} bg-blue-100 text-blue-800
                    {% else %} bg-gray-100 text-gray-800 {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    <div class="bg-white rounded shadow p-6">
        {% block content %}{% endblock %}
    </div>
</main>
</body>
</html>
