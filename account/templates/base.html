<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сайт{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2c3e50',
              primaryDark: '#1f2a36',
              accent: '#3498db',
              accentDark: '#2980b9',
            }
          }
        }
      }
    </script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800">
<header class="bg-primary text-white">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-4">
        <h1 class="text-xl font-semibold">Мой сайт</h1>
        <nav class="space-x-4">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}"
                   class="px-3 py-1 rounded hover:bg-primaryDark transition">
                    Профиль
                </a>
                <a href="{% url 'logout' %}"
                   class="px-3 py-1 rounded hover:bg-primaryDark transition">
                    Выход
                </a>
            {% else %}
                <a href="{% url 'login' %}"
                   class="px-3 py-1 rounded hover:bg-primaryDark transition">
                    Вход
                </a>
                <a href="{% url 'register' %}"
                   class="px-3 py-1 rounded hover:bg-primaryDark transition">
                    Регистрация
                </a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="max-w-3xl mx-auto mt-8 px-4">
    {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
                <div
                  class="px-3 py-2 rounded text-sm
                         {% if message.tags == 'success' %}
                            bg-green-100 text-green-800
                         {% elif message.tags == 'error' %}
                            bg-red-100 text-red-800
                         {% else %}
                            bg-gray-100 text-gray-800
                         {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="bg-white rounded shadow p-6">
        {% block content %}{% endblock %}
    </div>
</main>
</body>
</html>
